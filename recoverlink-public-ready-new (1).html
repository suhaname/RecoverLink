/* ============================== storage shim (localStorage, per-viewer) ============================== */

window.storage = {
  async get(key) {
    try {
      const v = localStorage.getItem("rl:" + key);
      if (v === null || v === undefined) return null;
      return { key, value: v, shared: false };
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    try {
      localStorage.setItem("rl:" + key, value);
      return { key, value, shared: false };
    } catch (e) {
      return null;
    }
  },
};

function daysSince(dateStr) {
  if (!dateStr) return null;
  const start = new Date(dateStr);
  if (isNaN(start.getTime())) return null;
  const now = new Date();
  const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
  return diff >= 0 ? diff + 1 : null;
}

const LEVEL_SCORE = { none: 0, mild: 1, moderate: 2, severe: 3 };
const SEVERITY_ORDER = ["Normal", "Monitor", "Urgent"];

/* ============================== surgery-specific check-in fields ============================== */

  vline: ["tag.vline.0", "tag.vline.1", "tag.vline.2"],

const EDUCATION_TIP_COUNT = 8;

const RED_FLAGS = [
  "fever", "chills",
  "heavy bleeding", "bleeding won't stop", "bleeding wont stop", "uncontrolled bleeding",
  "severe pain", "worse pain", "worsening pain", "increasing pain", "unbearable pain",
  "pus", "foul smell", "foul-smelling", "green discharge", "yellow discharge",
  "red streak", "spreading redness", "spreading red",
  "can't breathe", "cant breathe", "difficulty breathing", "trouble breathing",
  "vision", "chest pain",
];

const INJECTION_PHRASES = [
  "ignore previous instructions", "ignore your instructions", "ignore the instructions",
  "mark this as normal", "mark as normal", "don't notify", "do not notify", "dont notify",
  "skip the clinic", "don't tell the clinic", "do not tell the clinic",
];

function classifyCheckin({ day, pain, swelling, congestion, sleep, freeText, lang }) {
  const text = (freeText || "").toLowerCase();
  const redFlagHit = RED_FLAGS.find((p) => text.includes(p));
  const injectionHit = INJECTION_PHRASES.find((p) => text.includes(p));

  if (redFlagHit || injectionHit) {
    return {
      classification: "Urgent",
      redFlagTriggered: true,
      injectionDetected: Boolean(injectionHit),
      patientSummary: translate(lang, "triage.urgentRedFlag"),
      clinicianNote: injectionHit
        ? "Free text tried to steer the classification (\"" + injectionHit + "\"). Treated as a red flag: review manually."
        : "Red-flag phrase detected in free text (\"" + redFlagHit + "\"). Escalated regardless of numeric scores.",
    };
  }

  const expectedPainMax = day <= 3 ? 8 : day <= 7 ? 6 : day <= 14 ? 4 : day <= 28 ? 3 : 2;
  const expectedSwellingMax = day <= 7 ? 3 : day <= 14 ? 2 : day <= 28 ? 1 : 0;
  const swellingScore = LEVEL_SCORE[swelling] ?? 0;
  const congestionScore = LEVEL_SCORE[congestion] ?? 0;
  const painOver = pain - expectedPainMax;
  const swellingOver = swellingScore - expectedSwellingMax;

  if (painOver >= 3 || swellingOver >= 2) {
    return {
      classification: "Urgent",
      redFlagTriggered: false,
      injectionDetected: false,
      patientSummary: translate(lang, "triage.urgentPattern", { day: day }),
      clinicianNote: "Pain " + pain + "/10 (expected up to " + expectedPainMax + ") and/or swelling \"" + swelling + "\" clearly exceed the day-" + day + " pattern.",
    };
  }
  if (painOver >= 1 || swellingOver >= 1 || congestionScore >= 3 || sleep <= 2) {
    return {
      classification: "Monitor",
      redFlagTriggered: false,
      injectionDetected: false,
      patientSummary: translate(lang, "triage.monitor", { day: day }),
      clinicianNote: "Mild deviation from the day-" + day + " pattern (pain " + pain + "/10, swelling \"" + swelling + "\", congestion \"" + congestion + "\", sleep " + sleep + "/10). Add to next review batch.",
    };
  }
  return {
    classification: "Normal",
    redFlagTriggered: false,
    injectionDetected: false,
    patientSummary: translate(lang, "triage.normal", { day: day }),
    clinicianNote: "Within the expected day-" + day + " pattern. No action needed.",
  };
}

function escalate(level) {
  const i = SEVERITY_ORDER.indexOf(level);
  return SEVERITY_ORDER[Math.min(i + 1, SEVERITY_ORDER.length - 1)];
}

function visualAnalysisNote(classification, visionFailed, lang) {
  if (visionFailed) return { note: translate(lang, "visual.failed"), failed: true };
  if (classification === "Urgent") return { note: translate(lang, "visual.urgent"), failed: false };
  if (classification === "Monitor") return { note: translate(lang, "visual.monitor"), failed: false };
  return { note: translate(lang, "visual.normal"), failed: false };
}

function runTriage({ form, previousCheckin, visionFailed, lang }) {
  const base = classifyCheckin({ ...form, lang });
  let classification = base.classification;
  let patientSummary = base.patientSummary;
  let clinicianNote = base.clinicianNote;
  let trendEscalated = false;

  if (previousCheckin && !base.redFlagTriggered) {
    const painJump = form.pain - previousCheckin.pain;
    const swellingJump = (LEVEL_SCORE[form.swelling] ?? 0) - (LEVEL_SCORE[previousCheckin.swelling] ?? 0);
    if ((painJump >= 3 || swellingJump >= 2) && classification !== "Urgent") {
      classification = escalate(classification);
      trendEscalated = true;
      clinicianNote = clinicianNote + " Trend flag: pain moved " + previousCheckin.pain + "->" + form.pain + ", swelling " + previousCheckin.swelling + "->" + form.swelling + " since the last check-in.";
    }
  }

  let visualNote = null;
  let visionFailedFlag = false;
  if (form.photo) {
    const v = visualAnalysisNote(classification, visionFailed, lang);
    visualNote = v.note;
    visionFailedFlag = v.failed;
  }

  return {
    ...base,
    classification,
    patientSummary,
    clinicianNote,
    trendEscalated,
    visualNote,
    visionFailed: visionFailedFlag,
    noPhotoTip: !form.photo,
  };
}

function formatContactSymptoms(checkin, account, t, patientEmail, selectedClinic) {
  const lines = [];
  lines.push("Patient: " + (account && account.name ? account.name : "RecoverLink user"));
  lines.push("Patient email: " + (patientEmail || (account && account.email) || "Not provided"));
  lines.push("Clinic: " + (selectedClinic || (account && account.clinic) || "Not selected"));
  lines.push("Surgery: " + ((account && account.surgeryType) ? t("surgeryType." + account.surgeryType) : "Not provided"));
  lines.push("Surgery date: " + ((account && account.surgeryDate) || "Not provided"));
  lines.push("Check-in day: Day " + (checkin.day || "-"));
  lines.push("Recovery status: " + (checkin.classification || "Not assessed"));
  lines.push("");
  lines.push("Symptoms:");
  lines.push("- Pain: " + (checkin.pain ?? "-") + "/10");
  lines.push("- Swelling: " + (checkin.swelling ? t("symptom." + checkin.swelling) : "-"));
  lines.push("- Congestion: " + (checkin.congestion ? t("symptom." + checkin.congestion) : "-"));
  lines.push("- Bruising: " + (checkin.bruising ? t("symptom." + checkin.bruising) : "-"));
  lines.push("- Sleep quality: " + (checkin.sleep ?? "-") + "/10");
  lines.push("- Mood: " + (checkin.mood ? t("mood." + checkin.mood) : "-"));

  const surgeryType = account && account.surgeryType;
  if (surgeryType === "facelift") {
    lines.push("- Tightness / tension: " + (checkin.tightness ?? "-") + "/10");
  }
  if (surgeryType === "doubleEyelid") {
    lines.push("- Eye dryness / irritation / blurry vision: " + (checkin.eyeDryness ? "Yes" : "No"));
  }
  if (surgeryType === "facelift" || surgeryType === "rhinoplasty" || surgeryType === "vline") {
    lines.push("- Numbness / tingling: " + (checkin.numbness ? t("symptom." + checkin.numbness) : "-"));
    if (checkin.numbnessLocations && checkin.numbnessLocations.length) {
      lines.push("- Numbness location(s): " + checkin.numbnessLocations.map((k) => t("bodymap." + k)).join(", "));
    }
  }
  if (surgeryType === "rhinoplasty") {
    lines.push("- Breathing difficulty: " + (checkin.breathingDifficulty ?? "-") + "/10");
  }
  if (surgeryType === "vline") {
    lines.push("- Chewing difficulty / jaw stiffness: " + (checkin.chewingDifficulty ? t("chewing." + checkin.chewingDifficulty) : "-"));
  }
  if (checkin.tags && checkin.tags.length) {
    lines.push("- Quick tags: " + checkin.tags.map((k) => t(k)).join(", "));
  }
  if (checkin.freeText && checkin.freeText.trim()) {
    lines.push("- Additional notes: " + checkin.freeText.trim());
  }
  if (checkin.photo) {
    lines.push("");
    lines.push("Photo: A photo was added to this check-in. It is not attached to this email; the clinic can ask for it if needed.");
  }
  return lines.join("\n");
}

function ContactClinicPage({ checkin, account, t, onBack }) {
  const [clinic, setClinic] = useState((account && account.clinic) || "");
  const [email, setEmail] = useState((account && account.email) || "");
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);
  const [sendError, setSendError] = useState("");
  const formRef = React.useRef(null);
  const requestIdRef = React.useRef("");
  const EMAIL_BACKEND_URL = "https://script.google.com/macros/s/AKfycbzFM_gdIjWEV9mPJefRGOynkK5KeL1XRFcw5LuNK-Ps3T8C7oJPWzjLTNYYNSdlzmOv8A/exec";

  const selectedClinicEmail = clinicEmail(clinic);
  const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
  const message = formatContactSymptoms(checkin, account, t, email.trim(), clinic);
  const subject = "RecoverLink recovery update - Day " + (checkin.day || "");
  const fullBody = "Hello " + (clinic || "Clinic") + ",\n\nI would like to share my post-surgery recovery update and ask you to review my symptoms.\n\n" + message + "\n\nPlease let me know if I should take any further action.\n\nThank you,\n" + (account && account.name ? account.name : "RecoverLink user");

  React.useEffect(() => {
    function handleBackendMessage(event) {
      if (!event || !event.data || event.data.source !== "recoverlink-email-backend") return;
      if (requestIdRef.current && event.data.requestId !== requestIdRef.current) return;
      setSending(false);
      if (event.data.ok) {
        setSent(true);
        setSendError("");
      } else {
        setSent(false);
        setSendError(event.data.message || "The email could not be sent.");
      }
    }
    window.addEventListener("message", handleBackendMessage);
    return () => window.removeEventListener("message", handleBackendMessage);
  }, []);

  function sendEmail() {
    if (!selectedClinicEmail || !validEmail || sending) return;
    if (!EMAIL_BACKEND_URL || EMAIL_BACKEND_URL.indexOf("PASTE_YOUR_") === 0) {
      setSendError("Email sending is not connected yet. Deploy the included Google Apps Script backend and paste its /exec URL into the RecoverLink file.");
      setSent(false);
      return;
    }
    setSending(true);
    setSent(false);
    setSendError("");
    requestIdRef.current = "rl_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const form = formRef.current;
    if (!form) {
      setSending(false);
      setSendError("The email form could not be prepared. Please try again.");
      return;
    }
    form.clinic.value = clinic;
    form.to.value = selectedClinicEmail;
    form.fromEmail.value = email.trim();
    form.senderName.value = (account && account.name) ? account.name : "RecoverLink user";
    form.subject.value = subject;
    form.message.value = fullBody;
    form.requestId.value = requestIdRef.current;
    form.submit();
  }

  return (
    <div className="max-w-5xl mx-auto px-4 py-10">
      <iframe title="RecoverLink email sender" name="recoverlinkEmailFrame" className="hidden" aria-hidden="true"></iframe>
      <form ref={formRef} action={EMAIL_BACKEND_URL} method="POST" target="recoverlinkEmailFrame" className="hidden" aria-hidden="true">
        <input name="clinic" />
        <input name="to" />
        <input name="fromEmail" />
        <input name="senderName" />
        <input name="subject" />
        <textarea name="message" />
        <input name="requestId" />
      </form>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
          <p className="text-xs uppercase tracking-wider opacity-50 mb-1">RecoverLink</p>
          <h1 className="text-2xl" style={{ fontFamily: "var(--font-display)", color: "var(--ink)" }}>{t("contact.title")}</h1>
          <p className="text-sm opacity-65 mt-1">{t("contact.subtitle")}</p>
        </div>
        <button onClick={onBack} className="btn-outline rounded-full px-4 py-2 text-sm">← {t("contact.back")}</button>
      </div>

      <div className="max-w-xl mx-auto">
        <div className="surface-card rounded-3xl border p-5 sm:p-6" style={{ borderColor: "var(--mist)", background: "#fff" }}>
          <div className="flex items-center justify-between gap-2 mb-5">
            {[t("contact.step1"), t("contact.step2"), t("contact.step3")].map((step, i) => (
              <React.Fragment key={step}>
                <div className="flex items-center gap-2 text-xs" style={{ opacity: i === 0 ? 1 : 0.55 }}>
                  <span className="w-7 h-7 rounded-full flex items-center justify-center font-medium" style={{ background: i === 0 ? "var(--teal)" : "var(--teal-bg)", color: i === 0 ? "#fff" : "var(--ink)" }}>{i + 1}</span>
                  <span className="hidden sm:inline">{step.replace(/^\d+\. /, "")}</span>
                </div>
                {i < 2 && <span className="opacity-30">→</span>}
              </React.Fragment>
            ))}
          </div>

          <div className="space-y-5">
            <div>
              <label className="text-sm font-medium block mb-1.5">{t("contact.clinic")}</label>
              <select value={clinic} onChange={(e) => { setClinic(e.target.value); setSent(false); setSendError(""); }} className="w-full rounded-xl border px-3 py-3 text-sm" style={{ borderColor: "var(--mist)", color: "var(--ink)", background: "#fff" }}>
                <option value="">{t("contact.clinicPlaceholder")}</option>
                {CLINICS.map((name) => <option key={name} value={name}>{name}</option>)}
              </select>
            </div>

            {clinic && (
              <div className="rounded-2xl p-4" style={{ background: "var(--teal-bg)" }}>
                <div className="text-xs opacity-60 mb-1">{t("contact.clinicEmail")}</div>
                <div className="flex items-center gap-2 text-sm font-medium break-all">
                  <Mail size={15} style={{ color: "var(--teal)" }} />
                  {selectedClinicEmail || t("contact.noClinicEmail")}
                </div>
              </div>
            )}

            <div>
              <label className="text-sm font-medium block mb-1.5">{t("contact.patientEmail")}</label>
              <input type="email" value={email} onChange={(e) => { setEmail(e.target.value); setSent(false); setSendError(""); }} placeholder={t("contact.emailPlaceholder")} className="w-full rounded-xl border px-3 py-3 text-sm" style={{ borderColor: validEmail || !email ? "var(--mist)" : "var(--coral)" }} />
              <p className="text-xs opacity-55 mt-1.5">{t("contact.emailNote")}</p>
              {email && !validEmail && <p className="text-xs mt-1" style={{ color: "var(--coral)" }}>{t("contact.requiredEmail")}</p>}
            </div>

            <div>
              <label className="text-sm font-medium block mb-1.5">{t("contact.subject")}</label>
              <input value={subject} readOnly className="w-full rounded-xl border px-3 py-3 text-sm opacity-80" style={{ borderColor: "var(--mist)", background: "#f8fbf9" }} />
            </div>

            <div>
              <div className="flex items-center justify-between mb-1.5">
                <label className="text-sm font-medium">{t("contact.message")}</label>
                <span className="text-xs opacity-50">{t("contact.symptomsHeading")}</span>
              </div>
              <textarea value={fullBody} readOnly rows={18} className="w-full rounded-xl border px-3 py-3 text-xs leading-relaxed resize-y" style={{ borderColor: "var(--mist)", background: "#fbfdfc", color: "var(--ink)" }} />
              {checkin.photo && <p className="text-xs opacity-55 mt-1.5">{t("contact.photoNote")}</p>}
            </div>

            <div className="rounded-2xl border p-4 text-xs leading-relaxed" style={{ borderColor: "var(--mist)", background: "#fbfdfc" }}>
              <div className="flex gap-2">
                <ShieldCheck size={16} style={{ color: "var(--teal)" }} className="shrink-0" />
                <span>This sends the recovery update directly to the selected clinic email. The user email is used as the Reply-To address.</span>
              </div>
            </div>

            <button onClick={sendEmail} disabled={!selectedClinicEmail || !validEmail || sending} className="btn-coral w-full rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-2 disabled:opacity-50">
              <Send size={16} /> {sending ? "Sending..." : "Send email to my clinic"}
            </button>

            {sent && (
              <div className="rounded-xl p-4 text-sm leading-relaxed" style={{ background: "var(--teal-bg)", color: "var(--ink)" }}>
                <div className="font-medium mb-1">Email sent successfully ✓</div>
                <div className="text-xs opacity-70">Your recovery update was sent to {selectedClinicEmail}.</div>
              </div>
            )}

            {sendError && (
              <div className="rounded-xl p-4 text-sm leading-relaxed" style={{ background: "#fff1ef", color: "var(--ink)" }}>
                <div className="font-medium mb-1">Email not sent</div>
                <div className="text-xs opacity-75">{sendError}</div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function TrendChart({ data }) {
  const w = 300, h = 84, padL = 6, padR = 6, padT = 6, padB = 6;
  const n = data.length;
  const xAt = (i) => padL + (n <= 1 ? 0 : (i * (w - padL - padR)) / (n - 1));
  const yAt = (v) => padT + (h - padT - padB) * (1 - Math.max(0, Math.min(10, v)) / 10);
  const painPts = data.map((d, i) => xAt(i) + "," + yAt(d.pain)).join(" ");
  const swellPts = data.map((d, i) => xAt(i) + "," + yAt(d.swelling)).join(" ");
  return (
    <svg viewBox={"0 0 " + w + " " + h} width="100%" height="80" preserveAspectRatio="none">
      {[0, 5, 10].map((v) => (
        <line key={v} x1={padL} x2={w - padR} y1={yAt(v)} y2={yAt(v)} stroke="var(--mist)" strokeWidth="1" />
      ))}
      <polyline points={swellPts} fill="none" stroke="var(--purple)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      <polyline points={painPts} fill="none" stroke="var(--teal)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      {data.map((d, i) => (
        <circle key={i} cx={xAt(i)} cy={yAt(d.pain)} r="2.5" fill="var(--teal)" />
      ))}
    </svg>
  );
}

function HistoryView({ checkins, onOpen, onStart, t }) {
  if (checkins.length === 0) {
    return (
      <div className="text-center py-10">
        <p className="text-sm opacity-70 mb-4">{t("history.empty")}</p>
        <button onClick={onStart} className="btn-primary rounded-lg px-4 py-2 text-sm">
          {t("history.start")}
        </button>
      </div>
    );
  }

  const trendData = [...checkins].reverse().map((c) => ({ day: c.day, pain: c.pain, swelling: ((LEVEL_SCORE[c.swelling] ?? 0) * 10) / 3 }));

  let trendKey = "history.trendSteady";
  if (trendData.length >= 2) {
    const half = Math.max(1, Math.floor(trendData.length / 2));
    const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
    const earlyAvg = avg(trendData.slice(0, half).map((d) => d.pain));
    const lateAvg = avg(trendData.slice(-half).map((d) => d.pain));
    const diff = earlyAvg - lateAvg;
    trendKey = diff > 0.5 ? "history.trendDown" : diff < -0.5 ? "history.trendUp" : "history.trendSteady";
  }

  return (
    <div>
      {trendData.length >= 2 && (
        <div className="rounded-xl border p-3 mb-4" style={{ borderColor: "var(--mist)" }}>
          <div className="flex items-center justify-between mb-1">
            <p className="text-xs font-medium opacity-70">{t("history.painTrend")}</p>
            <div className="flex items-center gap-2.5 text-[10px] opacity-60">

                <span className="w-2 h-2 rounded-full inline-block" style={{ background: "var(--teal)" }} /> {t("history.painLegend")}
              </span>
              <span className="flex items-center gap-1">
                <span className="w-2 h-2 rounded-full inline-block" style={{ background: "var(--purple)" }} /> {t("history.swellingTrend")}
              </span>
            </div>
          </div>
          <TrendChart data={trendData} />
          <p className="text-xs mt-1.5 flex items-center gap-1.5" style={{ color: trendKey === "history.trendDown" ? "var(--teal)" : trendKey === "history.trendUp" ? "var(--clay)" : "var(--ink)", opacity: trendKey === "history.trendSteady" ? 0.6 : 1 }}>
            <TrendingUp size={12} style={{ transform: trendKey === "history.trendDown" ? "scaleY(-1)" : "none" }} />
            {t(trendKey)}
          </p>
        </div>
      )}
      <div className="space-y-2">
        {checkins.map((c) => (
          <button key={c.id} onClick={() => onOpen(c.id)} className="list-row w-full flex items-center justify-between rounded-lg border px-3 py-2.5 text-left text-sm" style={{ borderColor: "var(--mist)" }}>

          </button>
        ))}
      </div>
    </div>
  );
}

function TrackerPage({ account, checkins, onSignIn, accountLoading, accountNotice, onPersistCheckins, onDeleteHistory, onSignOut, onGoBooking, onGoContact, t, lang }) {
  const [screen, setScreen] = useState("account");
  const [consented, setConsented] = useState(false);
  const [simulateError, setSimulateError] = useState(false);
  const [simulateVisionError, setSimulateVisionError] = useState(false);
  const [simulateNotifyError, setSimulateNotifyError] = useState(false);
  const [showTools, setShowTools] = useState(false);
  const [form, setForm] = useState({
    day: 5, pain: 3, swelling: "mild", congestion: "mild", bruising: "mild", sleep: 6, mood: "neutral",
    tightness: 3, numbness: "none", numbnessLocations: [], breathingDifficulty: 2, eyeDryness: false,
    chewingDifficulty: "normal", tags: [], freeText: "", photo: null,
  });
  const [activeId, setActiveId] = useState(null);
  const [pipelineSteps, setPipelineSteps] = useState([]);
  const [pipelineIndex, setPipelineIndex] = useState(0);
  const activeCheckin = checkins.find((c) => c.id === activeId) || null;

  useEffect(() => {
    if (account) {
      if (account.surgeryDate) {
        const d = daysSince(account.surgeryDate);
        if (d) setForm((f) => ({ ...f, day: Math.min(120, d) }));
      }
      setScreen((prev) => (prev === "account" ? (account.isNew ? "onboarding" : "checkin") : prev));
    } else {
      setScreen("account");
      setConsented(false);
    }
  }, [account]);

  function updateForm(patch) {
    setForm((f) => ({ ...f, ...patch }));
  }

  function submitCheckin() {
    if (simulateError) {
      setScreen("loading");
      setPipelineSteps([t("pipeline.validating")]);
      setPipelineIndex(0);
      setTimeout(() => setScreen("error"), 900);
      return;
    }

    const previousCheckin = checkins[0] || null;
    const result = runTriage({ form, previousCheckin, visionFailed: simulateVisionError, lang });
    const needsNotification = result.classification !== "Normal";

    const steps = [
      t("pipeline.validating"),
      t("pipeline.history"),
      form.photo ? t("pipeline.analyzingPhoto") : t("pipeline.checkingPhoto"),
      t("pipeline.assessing"),
      ...(needsNotification ? [t("pipeline.notifying")] : []),
      t("pipeline.saving"),
      t("pipeline.scheduling"),
    ];

    setPipelineSteps(steps);
    setPipelineIndex(0);
    setScreen("loading");

    let i = 0;
    const advance = () => {
      i += 1;
      setPipelineIndex(i);
      if (i >= steps.length) {
        const id = Date.now();
        const record = {
          id,
          ...form,
          ...result,
          notifyFailed: needsNotification && simulateNotifyError,
          status: result.classification === "Normal" ? "auto-sent" : "pending review",
          feedback: null,
        };
        onPersistCheckins([record, ...checkins]);
        setActiveId(id);
        setScreen("result");
      } else {
        setTimeout(advance, 450);
      }
    };
    setTimeout(advance, 450);
  }

  function giveFeedback(id, val) {
    onPersistCheckins(checkins.map((c) => (c.id === id ? { ...c, feedback: val } : c)));
  }

  const progressPct = Math.min(100, Math.round((form.day / 42) * 100));

  return (
    <div className="max-w-5xl mx-auto px-4 py-10">
      <div className="flex flex-wrap items-center justify-between gap-3 mb-2">
        <h1 className="text-2xl" style={{ fontFamily: "var(--font-display)", color: "var(--ink)" }}>
          {t("tracker.title")}
        </h1>
        {screen !== "account" && (
          <button onClick={() => setShowTools((v) => !v)} className="flex items-center gap-1.5 text-xs opacity-50 hover:opacity-90 transition-opacity" style={{ color: "var(--ink)" }}>
            <SlidersHorizontal size={13} />
            {t("tracker.testingTools")}
          </button>
        )}
      </div>

      {showTools && screen !== "account" && (
        <div className="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs mb-6 rounded-lg border px-3 py-2 surface-card" style={{ borderColor: "var(--mist)", color: "var(--ink)", background: "#fff" }}>
          <label className="flex items-center gap-1.5">
            <input type="checkbox" checked={simulateError} onChange={(e) => setSimulateError(e.target.checked)} />
            {t("tracker.simTotal")}
          </label>
          <label className="flex items-center gap-1.5">
            <input type="checkbox" checked={simulateVisionError} onChange={(e) => setSimulateVisionError(e.target.checked)} />
            {t("tracker.simPhoto")}
          </label>
          <label className="flex items-center gap-1.5">
            <input type="checkbox" checked={simulateNotifyError} onChange={(e) => setSimulateNotifyError(e.target.checked)} />
            {t("tracker.simNotify")}
          </label>
        </div>
      )}

      <div className="flex justify-center mt-6">
        <div className="surface-card w-full max-w-sm rounded-3xl border overflow-hidden" style={{ borderColor: "var(--mist)", background: "#fff" }}>
          <div className="flex justify-center pt-3 pb-1">
            <div className="w-10 h-1 rounded-full" style={{ background: "var(--mist)" }} />
          </div>
          {accountNotice && screen !== "account" && (
            <div className="mx-6 mt-5 rounded-lg px-3 py-2 text-xs" style={{ background: "var(--teal-bg)", color: "var(--ink)" }}>
              {accountNotice}
            </div>
          )}

          {screen !== "onboarding" && screen !== "account" && (
            <div className="px-6 pt-5">
              <div className="flex items-center justify-between text-xs mb-1 opacity-60" style={{ color: "var(--ink)" }}>
                <span>{t("tracker.dayOf", { day: form.day })}</span>
                <span>{progressPct}%</span>
              </div>
              <div className="w-full h-1.5 rounded-full overflow-hidden" style={{ background: "var(--mist)" }}>
                <div className="h-full rounded-full transition-all duration-300" style={{ width: progressPct + "%", background: "var(--teal)" }} />
              </div>
            </div>
          )}

          <div key={screen} className="px-6 py-6 fade-in" style={{ color: "var(--ink)" }}>
            {screen === "account" && <AccountGate onSubmit={onSignIn} loading={accountLoading} notice={accountNotice} t={t} />}
            {screen === "onboarding" && <Onboarding consented={consented} setConsented={setConsented} onStart={() => setScreen("checkin")} t={t} />}
            {screen === "checkin" && <CheckinForm form={form} updateForm={updateForm} onSubmit={submitCheckin} t={t} surgeryType={account ? account.surgeryType : null} />}
            {screen === "loading" && <PipelineLoader steps={pipelineSteps} activeIndex={pipelineIndex} />}
            {screen === "error" && <ErrorState onRetry={() => setScreen("checkin")} t={t} />}
            {screen === "result" && activeCheckin && (
              <ResultView checkin={activeCheckin} giveFeedback={giveFeedback} onDone={() => setScreen("checkin")} onGoBooking={onGoBooking} onGoContact={onGoContact} account={account} t={t} />
            )}
            {screen === "history" && (
              <HistoryView
                checkins={checkins}
                onOpen={(id) => {
                  setActiveId(id);
                  setScreen("result");
                }}
                onStart={() => setScreen("checkin")}
                t={t}
              />
            )}
            {screen === "settings" && <SettingsView account={account} onDeleteHistory={onDeleteHistory} onSignOut={onSignOut} t={t} />}
          </div>

          {screen !== "onboarding" && screen !== "account" && (
            <div className="grid grid-cols-3 border-t text-xs" style={{ borderColor: "var(--mist)" }}>
              <TabButton label={t("tab.checkin")} active={["checkin", "loading", "result", "error"].includes(screen)} onClick={() => setScreen("checkin")} Icon={Send} />
              <TabButton label={t("tab.history")} active={screen === "history"} onClick={() => setScreen("history")} Icon={HistoryIcon} />
              <TabButton label={t("tab.settings")} active={screen === "settings"} onClick={() => setScreen("settings")} Icon={SettingsIcon} />
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

const TIME_SLOTS = ["08:00", "09:00", "10:30", "13:00", "15:00", "17:30"];
const REASON_KEYS = ["routine", "concern", "other"];
const REASON_LABEL_KEY = { routine: "booking.reasonRoutine", concern: "booking.reasonConcern", other: "booking.reasonOther" };

function resolveSlot(date, time) {
  const h = Number(time.split(":")[0]);
  if (h < 9) return { date, time: "09:00", adjusted: true };
  if (h >= 17) return { date, time: "16:30", adjusted: true };
  return { date, time, adjusted: false };
}

function buildBookingEmailParts({ patientEmail, reason, date, time, notes, t }) {
  const subject = t("booking.mailSubject");
  const lines = [
    t("booking.mailBodyIntro"),
    "",
    t("booking.mailBodyReason") + ": " + t(REASON_LABEL_KEY[reason]),
    t("booking.mailBodyDate") + ": " + (date || "-"),
    t("booking.mailBodyTime") + ": " + time,
    notes ? t("booking.mailBodyNotes") + ": " + notes : null,
    "",
    t("booking.mailBodyFrom") + ": " + (patientEmail || "-"),
  ].filter((l) => l !== null);
  return { subject, body: lines.join("\n") };
}

function buildGmailComposeUrl({ to, subject, body }) {
  return "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(to) + "&su=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}

function buildMailtoUrl({ to, subject, body }) {
  return "mailto:" + to + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}

function BookingPage({ account, t }) {
  const [form, setForm] = useState({
    reason: "routine",
    date: "",
    time: "10:30",
    notes: "",
    email: account && account.email ? account.email : "",
  });
  const [stage, setStage] = useState("form");
  const [slot, setSlot] = useState(null);

  const clinicEmailAddr = account && account.clinic ? clinicEmail(account.clinic) : "";

  function update(patch) {
    setForm((f) => ({ ...f, ...patch }));
  }

  // NOTE ON REAL EMAIL DELIVERY:
  // Sending a real confirmation email (via SendGrid, Mailgun, Nodemailer, etc.) cannot be
  // done safely from this client-side file. Any provider API key placed here would be
  // visible to anyone who views the page source, which is a serious security exposure.
  // Real email sending belongs in a backend step: either this project's own n8n workflow
  // (the "Notify Doctor" email node already does this server-side) or a small server
  // endpoint this app calls. This flow stays a clearly-labeled, timed simulation so the
  // user experience can still be demoed end to end.
  //
  // The clinic email field below is different: it opens the patient's own mail app via
  // a mailto: link (no keys, no server), pre-addressed to the clinic and pre-filled with
  // the booking details, so the patient sends the real email themselves.
  // The clinic email field below is different: it opens Gmail's web compose window via
  // a URL (view=cm), pre-addressed to the clinic and pre-filled with the booking details,
  // so the patient sends the real email themselves from their own Gmail account. No keys,
  // no server. If the popup is blocked, we fall back to a mailto: link so their device's
  // default mail app opens instead.
  function submit(e) {
    e.preventDefault();
    if (!form.date) return;
    if (clinicEmailAddr) {
      const { subject, body } = buildBookingEmailParts({
        patientEmail: form.email,
        reason: form.reason,
        date: form.date,
        time: form.time,
        notes: form.notes,
        t,
      });
      const gmailUrl = buildGmailComposeUrl({ to: clinicEmailAddr, subject, body });
      const win = window.open(gmailUrl, "_blank");
      if (!win || win.closed || typeof win.closed === "undefined") {
        window.location.href = buildMailtoUrl({ to: clinicEmailAddr, subject, body });
      }
    }
    setStage("sending");
    setTimeout(() => {
      setStage("sent");
      setTimeout(() => {
        setStage("booking");
        setTimeout(() => {
          setSlot(resolveSlot(form.date, form.time));
          setStage("confirmed");
        }, 1300);
      }, 1100);
    }, 800);
  }

  function reset() {
    setStage("form");
    setSlot(null);
  }

  const steps = [
    { id: "sending", label: t("step.sent") },
    { id: "booking", label: t("step.reviewing") },
    { id: "confirmed", label: t("step.confirmed") },
  ];
  const order = ["form", "sending", "sent", "booking", "confirmed"];
  const currentIndex = order.indexOf(stage);

  return (
    <div className="max-w-2xl mx-auto px-4 py-10" style={{ color: "var(--ink)" }}>
      <h1 className="text-2xl mb-1" style={{ fontFamily: "var(--font-display)" }}>
        {t("booking.title")}
      </h1>
      <p className="text-sm opacity-70 mb-6">{t("booking.subtitle")}</p>

      {stage !== "form" && (
        <div className="flex items-center gap-2 mb-6 flex-wrap">
          {steps.map((s, i) => {
            const reached = currentIndex >= order.indexOf(s.id);
            return (
              <div key={s.id} className="flex items-center gap-2">
                <div className="w-6 h-6 rounded-full flex items-center justify-center text-xs font-medium transition-colors duration-300" style={reached ? { background: "var(--teal)", color: "#fff" } : { background: "var(--mist)", color: "var(--ink)" }}>
                  {i + 1}
                </div>
                <span className="text-xs opacity-70">{s.label}</span>
                {i < steps.length - 1 && <div className="w-6 h-px" style={{ background: "var(--mist)" }} />}
              </div>
            );
          })}
        </div>
      )}

      <div key={stage} className="fade-in">
        {stage === "form" && (
          <form onSubmit={submit} className="surface-card rounded-2xl border p-5 space-y-4" style={{ borderColor: "var(--mist)", background: "#fff" }}>
            <div>
              <label className="text-sm block mb-1.5">{t("booking.reason")}</label>
              <select value={form.reason} onChange={(e) => update({ reason: e.target.value })} className="w-full rounded-lg border px-3 py-2 text-sm" style={{ borderColor: "var(--mist)" }}>
                {REASON_KEYS.map((k) => (
                  <option key={k} value={k}>
                    {t(REASON_LABEL_KEY[k])}
                  </option>
                ))}
              </select>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-sm block mb-1.5">{t("booking.date")}</label>
                <input type="date" required value={form.date} onChange={(e) => update({ date: e.target.value })} className="w-full rounded-lg border px-3 py-2 text-sm" style={{ borderColor: "var(--mist)" }} />
              </div>
              <div>
                <label className="text-sm block mb-1.5">{t("booking.time")}</label>
                <select value={form.time} onChange={(e) => update({ time: e.target.value })} className="w-full rounded-lg border px-3 py-2 text-sm" style={{ borderColor: "var(--mist)" }}>
                  {TIME_SLOTS.map((slotTime) => (
                    <option key={slotTime} value={slotTime}>
                      {slotTime}
                    </option>
                  ))}
                </select>
              </div>
            </div>
            <div>
              <label className="text-sm block mb-1.5">{t("booking.notes")}</label>
              <textarea value={form.notes} onChange={(e) => update({ notes: e.target.value })} rows={2} className="w-full rounded-lg border px-3 py-2 text-sm resize-none" style={{ borderColor: "var(--mist)" }} />

            <div>
              <label className="text-sm block mb-1.5">{t("booking.email")}</label>

            </div>
            <div>
              <label className="text-sm block mb-1.5">{t("booking.clinicEmail")}</label>
              <input
                type="text"
                readOnly
                value={clinicEmailAddr || t("booking.clinicEmailMissing")}

                style={{ borderColor: "var(--mist)", background: "var(--mint-bg)" }}
              />
              <p className="text-xs opacity-50 mt-1">{t("booking.clinicEmailNote")}</p>

          </form>
        )}

        {stage === "sending" && (
          <div className="surface-card rounded-2xl border" style={{ borderColor: "var(--mist)", background: "#fff" }}>
            <LoadingState text={t("booking.sending")} />
          </div>
        )}

        {(stage === "sent" || stage === "booking") && (
          <div className="space-y-4">
            <div className="surface-card rounded-2xl border p-4" style={{ borderColor: "var(--mist)", background: "#fff" }}>
              <div className="flex items-center gap-2 mb-1 text-xs opacity-60">
                <Mail size={13} /> {form.email} → {t("booking.toClinic")}
              </div>
              <p className="text-sm font-medium">{t(REASON_LABEL_KEY[form.reason])}</p>
              <p className="text-xs opacity-70">
                {form.date} · {form.time}
              </p>
            </div>
            <div className="surface-card rounded-2xl border" style={{ borderColor: "var(--mist)", background: "#fff" }}>
              <LoadingState text={stage === "sent" ? t("booking.sentWaiting") : t("booking.assistantChecking")} />
            </div>
          </div>
        )}

        {stage === "confirmed" && slot && (
          <div className="space-y-4">
            <div className="surface-card rounded-2xl border p-4" style={{ borderColor: "var(--mist)", background: "#fff" }}>
              <div className="flex items-center gap-2 mb-1 text-xs opacity-60">
                <Mail size={13} /> {form.email} → {t("booking.toClinic")}
              </div>
              <p className="text-sm font-medium">{t(REASON_LABEL_KEY[form.reason])}</p>
              <p className="text-xs opacity-70">
                {form.date} · {form.time}
              </p>
            </div>

            <div className="surface-card rounded-2xl border p-4" style={{ borderColor: "var(--teal)", background: "var(--teal-bg)" }}>
              <div className="flex items-center gap-2 mb-1 text-xs opacity-70">
                <MailCheck size={13} /> {t("booking.toClinic")} → {form.email}
              </div>
              <p className="text-sm font-medium mb-1">{t("booking.confirmed")}</p>
              <p className="text-sm mb-1 flex items-center gap-1">
                <CalendarCheck2 size={14} style={{ color: "var(--teal)" }} />
                {slot.date} · {slot.time}
              </p>
              {slot.adjusted && <p className="text-xs opacity-70">{t("booking.adjusted")}</p>}
            </div>

            <button onClick={reset} className="btn-outline rounded-lg px-4 py-2 text-sm">
              {t("booking.bookAnother")}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function RecoverLinkSite() {
  const [page, setPage] = useState("home");
  const [contactCheckin, setContactCheckin] = useState(null);
  const [account, setAccount] = useState(null);
  const [checkins, setCheckins] = useState([]);
  const [accountLoading, setAccountLoading] = useState(false);
  const [accountNotice, setAccountNotice] = useState("");
  const [lang, setLang] = useState("en");

  useEffect(() => {
    let mounted = true;
    loadLanguagePref().then((saved) => {
      if (mounted && saved) setLang(saved);
    });
    return () => {
      mounted = false;
    };
  }, []);

  function changeLang(code) {
    setLang(code);
    saveLanguagePref(code);
  }

  const t = (key, vars) => translate(lang, key, vars);

  async function handleSignIn({ name, email, surgeryDate, clinic, surgeryType, doctorName }) {
    setAccountLoading(true);
    const normalizedEmail = email.toLowerCase();
    const existing = await loadAccount(normalizedEmail);
    if (existing) {
      setAccount({
        name: existing.name || name,
        email: normalizedEmail,
        surgeryDate: existing.surgeryDate || surgeryDate,
        clinic: existing.clinic || clinic,
        surgeryType: existing.surgeryType || surgeryType,
        doctorName: existing.doctorName || doctorName,
        guest: !STORAGE_AVAILABLE,
        isNew: false,
      });
      setCheckins(existing.checkins || []);
      setAccountNotice(existing.name ? t("account.welcomeBack", { name: existing.name }) : t("account.welcomeBackGeneric"));
    } else {
      const fresh = { name, email: normalizedEmail, surgeryDate, clinic, surgeryType, doctorName, checkins: [] };
      const ok = await saveAccount(normalizedEmail, fresh);
      setAccount({ name, email: normalizedEmail, surgeryDate, clinic, surgeryType, doctorName, guest: !ok, isNew: true });
      setCheckins([]);
      setAccountNotice(ok ? "" : t("account.storageOffline"));
    }
    setAccountLoading(false);
  }

  function persistCheckins(nextCheckins) {
    setCheckins(nextCheckins);
    if (account && !account.guest) {
      saveAccount(account.email, {
        name: account.name,
        email: account.email,
        surgeryDate: account.surgeryDate,
        clinic: account.clinic,
        surgeryType: account.surgeryType,
        doctorName: account.doctorName,
        checkins: nextCheckins,
      });
    }
  }

  function deleteHistory() {
    setCheckins([]);
    if (account && !account.guest) {
      saveAccount(account.email, {
        name: account.name,
        email: account.email,
        surgeryDate: account.surgeryDate,
        clinic: account.clinic,
        surgeryType: account.surgeryType,
        doctorName: account.doctorName,
        checkins: [],
      });
    }
  }

  function goContact(checkin) {
    setContactCheckin(checkin);
    setPage("contact");
  }

  function signOut() {
    setContactCheckin(null);
    setAccount(null);
    setCheckins([]);
    setAccountNotice("");
  }

  return (
    <div className="page-canvas w-full" style={{ minHeight: "100%" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap');
        :root {
          --mint-bg: #EAF5F0;
          --ink: #123B34;
          --teal: #1E7A67;
          --teal-bg: linear-gradient(135deg, #EDF8F3, #D3EAE1);
          --purple: #6D5FD8;
          --purple-bg: linear-gradient(135deg, #F1EFFC, #E0DBF9);
          --coral: #E1665C;
          --coral-bg: linear-gradient(135deg, #FDEDEA, #F8D9D4);
          --clay: #9C6B2E;
          --clay-bg: linear-gradient(135deg, #F7EFDF, #EDE0C8);
          --mist: #D8E6DE;
          --font-display: 'Fraunces', serif;
          --font-hand: 'Caveat', cursive;
        }
        body { background: var(--mint-bg); color: var(--ink); color-scheme: light; }
        * { font-family: 'Public Sans', system-ui, sans-serif; }
        input[type="range"] { accent-color: var(--teal); }

        button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
          outline: 2px solid var(--teal);
          outline-offset: 2px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.25s ease; }

        .surface-card { box-shadow: 0 1px 3px rgba(18,59,52,0.05), 0 8px 20px rgba(18,59,52,0.07); }

        .btn-primary { background: linear-gradient(135deg, #23977a, var(--teal)); color: #fff; box-shadow: 0 3px 10px rgba(30,122,103,0.28); transition: filter .15s ease, transform .1s ease, box-shadow .15s ease; }
        .btn-primary:hover { filter: brightness(1.05); box-shadow: 0 5px 16px rgba(30,122,103,0.34); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

        .btn-dark { background: linear-gradient(135deg, #1a332d, var(--ink)); color: #fff; box-shadow: 0 3px 10px rgba(18,59,52,0.25); transition: filter .15s ease, transform .1s ease, box-shadow .15s ease; }
        .btn-dark:hover { filter: brightness(1.25); }
        .btn-dark:active { transform: scale(0.97); }
        .btn-dark:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        .btn-coral { background: linear-gradient(135deg, #e8817a, var(--coral)); color: #fff; box-shadow: 0 3px 10px rgba(225,102,92,0.3); transition: filter .15s ease, transform .1s ease, box-shadow .15s ease; }
        .btn-coral:hover { filter: brightness(1.05); box-shadow: 0 5px 16px rgba(225,102,92,0.36); }
        .btn-coral:active { transform: scale(0.97); }

        .card-hover { transition: transform .2s ease, box-shadow .2s ease; }
        .card-hover:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(18,59,52,0.12); }

        .page-canvas { background: radial-gradient(1100px circle at 12% -10%, #ffffff 0%, #eef8f3 30%, var(--mint-bg) 58%, #e2f0e8 100%); }

        .btn-outline { background: transparent; border: 1px solid var(--mist); color: var(--ink); transition: background .15s ease, border-color .15s ease, transform .1s ease; }
        .btn-outline:hover { background: var(--teal-bg); border-color: var(--teal); }
        .btn-outline:active { transform: scale(0.97); }

        .btn-teal-outline { background: transparent; border: 1px solid var(--teal); color: var(--teal); transition: background .15s ease, transform .1s ease; }
        .btn-teal-outline:hover { background: var(--teal-bg); }
        .btn-teal-outline:active { transform: scale(0.97); }

        .seg-btn { transition: background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease; }
        .seg-btn:active { transform: scale(0.96); }
        .seg-active { background: var(--ink); color: #fff; border-color: var(--ink); }
        .seg-inactive { background: transparent; color: var(--ink); border-color: var(--mist); }
        .seg-inactive:hover { background: var(--teal-bg); border-color: var(--teal); }

        .nav-btn { transition: background .15s ease, opacity .15s ease; }
        .nav-active { background: var(--ink); color: var(--mint-bg); }
        .nav-inactive { background: transparent; color: var(--ink); opacity: 0.7; }
        .nav-inactive:hover { opacity: 1; background: var(--teal-bg); }

        .tab-btn { transition: opacity .15s ease, color .15s ease; }
        .tab-active { color: var(--teal); opacity: 1; }
        .tab-inactive { color: var(--ink); opacity: 0.5; }
        .tab-inactive:hover { opacity: 0.85; }

        .list-row { transition: background .15s ease, border-color .15s ease; }
        .list-row:hover { background: var(--teal-bg); border-color: var(--teal); }

        .step-btn { transition: background .15s ease; }
        .step-btn:hover { background: var(--teal-bg); }
      `}</style>

      <Header page={page} setPage={setPage} t={t} lang={lang} onChangeLang={changeLang} />
      <div key={page} className="fade-in">
        {page === "home" && <HomePage onGoTracker={() => setPage("tracker")} onGoBooking={() => setPage("booking")} t={t} />}
        {page === "tracker" && (
          <TrackerPage
            account={account}
            checkins={checkins}
            onSignIn={handleSignIn}
            accountLoading={accountLoading}
            accountNotice={accountNotice}
            onPersistCheckins={persistCheckins}
            onDeleteHistory={deleteHistory}
            onSignOut={signOut}
            onGoBooking={() => setPage("booking")}
            onGoContact={goContact}
            t={t}
            lang={lang}
          />
        )}
        {page === "contact" && contactCheckin && <ContactClinicPage checkin={contactCheckin} account={account} t={t} onBack={() => setPage("tracker")} />}
        {page === "booking" && <BookingPage account={account} t={t} />}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<RecoverLinkSite />);

</script>
